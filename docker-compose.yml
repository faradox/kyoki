x-all: &all
  LOG_LEVEL: ${KYOKI_LOG_LEVEL:-INFO}
  WEBSOCKET_IDLE_TIMEOUT: ${KYOKI_WEBSOCKET_IDLE_TIMEOUT:-90}

services:
  kyoki-dev:
    build:
      context: ./
      target: kyoki-dev
    image: kyoki-dev:latest
    container_name: kyoki-dev
    restart: unless-stopped
    ports:
      - "${KYOKI_DEV_PORT:-1337}:1337"
    volumes:
      - ./app:/home/player/kyoki/app
    environment:
      <<: [*all]
  kyoki-prod:
    build:
      context: ./
      target: kyoki-prod
    image: kyoki:latest
    container_name: kyoki
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Loopback only: production is meant to sit behind a reverse proxy.
    ports:
      - "127.0.0.1:${KYOKI_PORT:-1337}:1337"
    environment:
      <<: [*all]
